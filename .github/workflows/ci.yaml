name: CI

# The suite checks itself against dart_monty_core:
#   manifest  every case bound to its expected outcome (offline)
#   runner    the Dart runner analyses clean against the core it targets
#   current   the core commit in CORE_REF reproduces tool/parity/baseline-current.json
#             case by case on vm, dart2js and dart2wasm (what core's own CI job asserts)
#   baseline  core 5873ec5, where the capability manifest's baseline was
#             measured, reproduces that baseline (the instrument check)
#   e0        the E0 cases through core's monty-proto worker at CORE_REF match
#             upstream on vm, dart2js and dart2wasm, and the worker crash
#             tests pass on each
# The expected outcomes are regenerated by parity-oracle.yaml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CORE_REPO: runyaga/dart_monty_core

jobs:
  manifest:
    name: Parity manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I tool/check_parity_manifest.py

  core-ref:
    name: Read CORE_REF
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - id: ref
        run: |
          sha="$(tr -d '[:space:]' < CORE_REF)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "CORE_REF must hold one full commit SHA, got '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The current baseline, on the core commit it was recorded for
  # ---------------------------------------------------------------------------
  # Expectations are per architecture (baseline-current.json `platforms`); on
  # this x86_64 runner float_values is PARTIAL on vm and dart2wasm (core's NaN
  # sign bit), and nothing else may differ.
  current:
    name: Current baseline (core CORE_REF on vm, dart2js, dart2wasm)
    needs: [core-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.core-ref.outputs.sha }}
          path: core
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/native
          key: core-${{ needs.core-ref.outputs.sha }}
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-parity-${{ runner.os }}-${{ hashFiles('packages/monty_parity/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Upstream pins equal core's
        run: python3 -I tool/check_core_upstream.py --core core
      - name: Analyze the parity runner
        working-directory: packages/monty_parity
        # run.py writes the override and bakes cases.g.dart per run; the
        # same stand-ins here let the runner and its web test analyse.
        run: |
          printf 'dependency_overrides:\n  dart_monty_core:\n    path: %s\n' "$GITHUB_WORKSPACE/core" > pubspec_overrides.yaml
          dart pub get
          printf 'const parityCases = <String>[];\n' > test/cases.g.dart
          dart format --output=none --set-exit-if-changed bin lib \
            test/parity_web_test.dart test/parity_worker_web_test.dart \
            test/worker_crash_vm_test.dart test/worker_crash_web_test.dart
          dart analyze --fatal-infos
          rm test/cases.g.dart pubspec_overrides.yaml
      - name: Run on the VM (FFI)
        run: python3 -I tool/parity/run.py vm --core core --out /tmp/parity
      - name: Run on dart2js
        run: python3 -I tool/parity/run.py dart2js --core core --out /tmp/parity
      - name: Run on dart2wasm
        run: python3 -I tool/parity/run.py dart2wasm --core core --out /tmp/parity
      - name: Score and assert the current baseline
        run: |
          python3 -I tool/parity/score.py /tmp/parity \
            --json /tmp/parity/score.json --markdown /tmp/parity/score.md \
            --assert-current tool/parity/baseline-current.json
      - name: Publish the scorecard
        if: success() || failure()
        run: '[ -f /tmp/parity/score.md ] && cat /tmp/parity/score.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: parity-current
          path: /tmp/parity
          retention-days: 14

  # ---------------------------------------------------------------------------
  # E0 through core's worker (tool/parity/e0.json)
  # ---------------------------------------------------------------------------
  # Every counted E0 case must MATCH upstream on each backend through the
  # worker engine: a worker process on the VM (the executable core's
  # tool/build_worker.sh builds from that checkout), a Web Worker running
  # core's committed proto-worker wasm on dart2js and dart2wasm. Each run.py
  # step also runs the worker crash tests on its backend and fails if any
  # fails. A deferred case is reported, not counted.
  e0:
    name: E0 through the worker (core CORE_REF on vm, dart2js, dart2wasm)
    needs: [core-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ needs.core-ref.outputs.sha }}
          path: core
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core/native
            core/native/worker
          key: core-e0-${{ needs.core-ref.outputs.sha }}
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-parity-${{ runner.os }}-${{ hashFiles('packages/monty_parity/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Build core's worker executable
        run: bash core/tool/build_worker.sh
      - name: E0 on the VM (worker process) + crash tests
        run: python3 -I tool/parity/run.py vm --engine worker --core core --out /tmp/e0
      - name: E0 on dart2js (Web Worker) + crash tests
        run: python3 -I tool/parity/run.py dart2js --engine worker --core core --out /tmp/e0
      - name: E0 on dart2wasm (Web Worker) + crash tests
        run: python3 -I tool/parity/run.py dart2wasm --engine worker --core core --out /tmp/e0
      - name: Assert E0
        run: |
          python3 -I tool/parity/score.py /tmp/e0 --assert-e0 \
            --json /tmp/e0/e0.json --markdown /tmp/e0/e0.md
      - name: Publish the E0 table
        if: success() || failure()
        run: '[ -f /tmp/e0/e0.md ] && cat /tmp/e0/e0.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: parity-e0
          path: /tmp/e0
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The instrument check: reproduce the measured baseline
  # ---------------------------------------------------------------------------
  # Core 5873ec5 is the commit the capability manifest's baseline was measured
  # on (arm64 under this suite's rules: FFI PRESENT 36/185, the manifest's 37
  # less the rows in rows.json `rescored`). On this x86_64 runner float_values
  # is PARTIAL on vm and dart2wasm (core's NaN sign bit), so FFI PRESENT is
  # 35/185, dart2js 35, dart2wasm 34 (tool/parity/rows.json `platforms`). An
  # instrument that cannot reproduce a known measurement is not trusted with a
  # new one.
  #
  # RUSTUP_TOOLCHAIN overrides that commit's rust-toolchain.toml, which lists
  # cross targets the host build never uses; the build itself is unchanged.
  baseline:
    name: Measured baseline (core 5873ec5 on vm, dart2js, dart2wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      BASELINE_CORE: 5873ec55747083b3ee64411d11cf62315a7200f3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.BASELINE_CORE }}
          path: core
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/native
          key: core-5873ec5
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-parity-${{ runner.os }}-${{ hashFiles('packages/monty_parity/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Its browser WASI worker (npm, pinned by its package-lock.json)
        working-directory: core/js
        run: npm ci --force --silent
      - name: Run on the VM (FFI)
        run: python3 -I tool/parity/run.py vm --core core --out /tmp/parity
      - name: Run on dart2js
        run: python3 -I tool/parity/run.py dart2js --core core --out /tmp/parity
      - name: Run on dart2wasm
        run: python3 -I tool/parity/run.py dart2wasm --core core --out /tmp/parity
      - name: Score and assert the baseline
        run: |
          python3 -I tool/parity/score.py /tmp/parity \
            --json /tmp/parity/score.json --markdown /tmp/parity/score.md \
            --assert-rows --assert-baseline
      - name: Publish the scorecard
        if: success() || failure()
        run: '[ -f /tmp/parity/score.md ] && cat /tmp/parity/score.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: parity-baseline-5873ec5
          path: /tmp/parity
          retention-days: 14
