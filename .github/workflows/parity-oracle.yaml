name: Parity oracle

# Regenerates every parity expected outcome (tool/parity/expected) from the
# reference oracle -- pydantic-monty 1.1.0 by sha256 (tool/upstream) and
# upstream monty at the pinned commit for three Rust-only probes -- and fails
# on any byte of difference, or on a manifest that does not bind them.
#
# Runs when a parity input changes (the paths below), weekly, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'tool/parity/cases/**'
      - 'tool/parity/expected/**'
      - 'tool/parity/manifest.json'
      - 'tool/parity/oracle/**'
      - 'tool/upstream/**'
      - 'tool/check_parity_manifest.py'
      - '.github/workflows/parity-oracle.yaml'
  pull_request:
    paths:
      - 'tool/parity/cases/**'
      - 'tool/parity/expected/**'
      - 'tool/parity/manifest.json'
      - 'tool/parity/oracle/**'
      - 'tool/upstream/**'
      - 'tool/check_parity_manifest.py'
      - '.github/workflows/parity-oracle.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC

permissions:
  contents: read

jobs:
  regenerate:
    name: Expected outcomes regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tool/parity/oracle/rust
          key: parity-rust-oracle
      - name: Install the pinned oracle
        run: |
          python3 -m venv /tmp/oracle
          /tmp/oracle/bin/pip install -q --disable-pip-version-check --no-cache-dir \
            --require-hashes --only-binary :all: --no-deps \
            -r tool/upstream/requirements.lock \
            -r tool/parity/oracle/otel-requirements.lock
      - name: Build the Rust oracle
        working-directory: tool/parity/oracle/rust
        run: cargo build --locked --release
      - name: The oracle's canonical encoding is stable
        run: /tmp/oracle/bin/python -I tool/parity/oracle/test_canon.py
      - name: Expected outcomes regenerate identically
        run: >-
          /tmp/oracle/bin/python -I tool/parity/oracle/check_expected.py
          --rust tool/parity/oracle/rust/target/release/parity-rust-oracle
      - name: Display renderings recorded, and a wrong one fails the regeneration
        run: >-
          /tmp/oracle/bin/python -I tool/parity/oracle/test_display.py
          --rust tool/parity/oracle/rust/target/release/parity-rust-oracle
