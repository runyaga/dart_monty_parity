name: monty_parity
description: >-
  Parity runner: drives the parity cases through dart_monty_core's public API
  on the Dart VM (FFI), dart2js and dart2wasm, for scoring against upstream
  pydantic-monty (tool/parity).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  # The core checkout under test. tool/parity/run.py --core DIR writes a
  # pubspec_overrides.yaml pointing here at DIR for the run.
  dart_monty_core: any

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.0.0
