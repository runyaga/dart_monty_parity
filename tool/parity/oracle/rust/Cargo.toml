# Oracle for the three Rust-only capability rows no upstream binding exposes
# (continuation detection, MontyRun::new, MontyRun::code): upstream monty
# itself, at the commit tool/upstream/upstream-pin.json pins.
[package]
name = "parity-rust-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
monty = { git = "https://github.com/pydantic/monty", rev = "e8db9aef41aa73f4f709c15a4bc8a2d198be5ead" }
monty-types = { git = "https://github.com/pydantic/monty", rev = "e8db9aef41aa73f4f709c15a4bc8a2d198be5ead" }
serde_json = "1"

[workspace]
